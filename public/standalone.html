  <title>Direction du Contentieux - Instruction Juridique</title>
  <style>
    /* ==========================================================================
       CSS - DIRECTION ARTISTIQUE BRUTALISTE & SOBRIÉTÉ ADMINISTRATIVE
       Palette : Noir (#000000), Blanc (#FFFFFF), Rouge Procédural (#CC0000)
       Typographie : Monospace (Courier New, Courier, monospace)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Courier New", Courier, monospace;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* En-tête administratif */
    header {
      padding: 14px 24px;
      border-bottom: 2px solid #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .badge-header {
      background-color: #ffffff;
      color: #000000;
      font-weight: bold;
      padding: 2px 6px;
      margin-right: 8px;
    }

    .stat-groupe {
      display: flex;
      gap: 20px;
      font-weight: bold;
    }

    .alerte-rouge {
      color: #cc0000;
    }

    /* Zone centrale d'affichage du dossier */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      position: relative;
      overflow-y: auto;
    }

    .dossier-card {
      border: 4px solid #ffffff;
      padding: 20px 24px;
      max-width: 960px;
      width: 100%;
      background-color: #000000;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .dossier-meta {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ffffff;
      padding-bottom: 8px;
      margin-bottom: 14px;
      font-size: 11px;
      color: #888888;
    }

    .dossier-body-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
      margin-bottom: 14px;
    }

    @media (max-width: 768px) {
      .dossier-body-grid {
        grid-template-columns: 1fr;
      }
    }

    .dossier-col-text {
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: space-between;
    }

    .dossier-bloc-text {
      background-color: #0a0a0a;
      border: 1px solid #262626;
      padding: 12px;
    }

    .dossier-section-title {
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      color: #888888;
      display: flex;
      justify-content: space-between;
    }

    .dossier-faits {
      font-size: 13px;
      line-height: 1.5;
      color: #ffffff;
    }

    .dossier-jargon {
      font-size: 12px;
      font-style: italic;
      line-height: 1.5;
      color: #00ff66;
    }

    /* Pièce visuelle versée au dossier */
    .dossier-col-media {
      display: flex;
      flex-direction: column;
    }

    .piece-visuelle-cadre {
      border: 1px solid #404040;
      background-color: #0a0a0a;
      padding: 8px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .piece-visuelle-entete {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #888888;
      border-bottom: 1px solid #262626;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .point-enregistrement {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #cc0000;
      border-radius: 50%;
      margin-right: 4px;
      animation: pulseRecord 1s infinite;
    }

    @keyframes pulseRecord {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .piece-visuelle-img-wrapper {
      position: relative;
      border: 1px solid #262626;
      overflow: hidden;
      background-color: #000000;
    }

    .piece-visuelle-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      filter: contrast(125%) brightness(95%) grayscale(100%);
      display: block;
    }

    .crt-scanline {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      opacity: 0.4;
    }

    .badge-confidentiel {
      position: absolute;
      top: 4px;
      left: 4px;
      background-color: rgba(0,0,0,0.85);
      border: 1px solid #555555;
      color: #cccccc;
      font-size: 8px;
      padding: 1px 4px;
      letter-spacing: 1px;
    }

    .piece-visuelle-ref {
      font-size: 9px;
      color: #777777;
      margin-top: 6px;
      line-height: 1.3;
    }

    /* Zone de notification administrative */
    .notification-feedback {
      border: 2px solid #ffffff;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
      line-height: 1.4;
    }

    .notification-feedback.erreur {
      border-color: #cc0000;
      color: #cc0000;
      background-color: #110000;
    }

    .notification-feedback.succes {
      border-color: #ffffff;
      color: #ffffff;
      background-color: #151515;
    }

    /* Pupitre des 3 tampons ou bouton de passage */
    .pupitre-tampons {
      border-top: 2px solid #ffffff;
      padding-top: 12px;
    }

    .pupitre-titre {
      font-size: 10px;
      letter-spacing: 1px;
      color: #888888;
      text-align: center;
      margin-bottom: 8px;
    }

    .grille-tampons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .btn-tampon {
      background-color: #000000;
      border: 2px solid #ffffff;
      color: #ffffff;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.1s;
    }

    .btn-tampon:hover {
      background-color: #181818;
    }

    .btn-tampon:active {
      transform: scale(0.97);
    }

    .btn-tampon-entete {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .raccourci-badge {

      color: #000000;
      font-weight: bold;
      font-size: 10px;
      padding: 1px 4px;
    }

    .btn-tampon-label {

      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .btn-tampon-desc {
      font-size: 9px;
      color: #888888;
      line-height: 1.3;
    }

    /* Bouton passage manuel */
    .btn-suivant {

      padding: 12px 18px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border: 2px solid #ffffff;
      background-color: #ffffff;
      color: #000000;
      text-align: center;
    }

    .btn-suivant:hover {

    .btn-suivant.alerte-fin {

      border-color: #cc0000;
      color: #ffffff;
    }

    .btn-suivant.alerte-fin:hover {
      background-color: #990000;
    }

    /* Animation du tampon rouge/vert - apposé directement sur le cliché */
    .tampon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(var(--angle, -4deg));
      border: 3px dashed #00ff66;
      color: #00ff66;
      background-color: rgba(0, 0, 0, 0.85);
      padding: 10px 14px;
      text-align: center;
      pointer-events: none;
      z-index: 50;
      width: 88%;
      max-width: 260px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
      animation: tamponImpact 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .tampon.erreur {
      border-color: #ff2222;
      color: #ff2222;
      box-shadow: 0 0 25px rgba(255, 34, 34, 0.4);
    }

    .tampon-texte {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      word-wrap: break-word;
      line-height: 1.2;
    }

    .tampon-mention {
      font-size: 8px;
      letter-spacing: 1px;
      border-top: 1px solid currentColor;
      padding-top: 4px;
      margin-top: 4px;
    }

    @keyframes tamponImpact {
      0% {
        transform: translate(-50%, -50%) rotate(var(--angle, -4deg)) scale(2.0);
        opacity: 0;
      }
      40% {
        transform: translate(-50%, -50%) rotate(var(--angle, -4deg)) scale(0.95);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) rotate(var(--angle, -4deg)) scale(1);
        opacity: 1;
      }
    }

    /* Secousse générale de l'écran lors du coup de tampon */
    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(4px, -2px); }
      60% { transform: translate(-2px, -3px); }
      80% { transform: translate(3px, 1px); }
      100% { transform: translate(0, 0); }
    }

    .shaking {
      animation: screenShake 0.18s ease-in-out;
    }

    /* Écran de Suspension et Modal d'Introduction */
    .fenetre-modale {
      border: 4px solid #ffffff;
      padding: 36px;
      text-align: center;
      max-width: 720px;
      background-color: #000000;

    .modal-titre {

      font-weight: 900;
      margin-bottom: 16px;
      letter-spacing: 2px;

      font-weight: bold;

      text-align: left;
      font-size: 12px;

    .btn-action {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 14px 32px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;

    /* Minuteur en bloc dur */

      padding: 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;

      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 1px;
      color: #aaaaaa;

      width: 100%;
      height: 14px;
      background-color: #111111;
      border: 2px solid #ffffff;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      transition: none;
    }

    .progress-bar.urgent {
      background-color: #cc0000;
    }
  </style>

    // =========================================================================
    // AUDIO : IMPACT DU TAMPON
    // =========================================================================
    let audioCtx = null;

    function jouerSonTampon() {
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioClass) return;
        if (!audioCtx) audioCtx = new AudioClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const t = audioCtx.currentTime;

        // Onde d'impact basse fréquence
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(28, t + 0.12);
        gain.gain.setValueAtTime(0.9, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.15);

        // Clac sec
        const buff = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.06, audioCtx.sampleRate);
        const data = buff.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buff;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1600, t);
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.5, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(t);
      } catch (e) {
        console.warn("Audio non initialisé", e);
      }
    }

    // =========================================================================
    // 2. ÉTAT DU JEU ET GESTION DES DOSSIERS
    // =========================================================================
    let indexActuel = 0;
    let dossiersTraites = 0;
    let blames = 0;
    let tempsRestant = 26.0;
    let tempsMax = 26.0;
    let timerId = null;
    let dernierTick = 0;
    let estEnAttenteSuivant = false;
    let estEnGameOver = false;

    const zoneCentrale = document.getElementById("zone-centrale");
    const barreTemps = document.getElementById("barre-temps");
    const tempsTexte = document.getElementById("temps-texte");
    const compteurElement = document.getElementById("compteur");
    const statBlames = document.getElementById("stat-blames");
    const statCadence = document.getElementById("stat-cadence");
    const bodyElement = document.getElementById("app");

    function calculerTempsTour(index) {
      if (index < 3) return 26.0;
      return Math.max(12.0, 26.0 / Math.pow(1.12, index - 2));
    }

    function afficherIntro() {
      zoneCentrale.innerHTML = `
        <div class="fenetre-modale">
          <div class="modal-titre">BUREAU D'INSTRUCTION ET DE QUALIFICATION JURIDIQUE</div>
          <div class="modal-message">Direction du Contentieux et des Affaires Juridiques</div>
          <div class="modal-regles">
            <strong>1. [NON-LIEU // USAGE CONFORME] :</strong> Usage de la force proportionné aux nécessités de l'ordre public, aléa médical spontané.<br/>
            <strong>2. [VIOLENCES SUR DÉPOSITAIRE] :</strong> Préjudice matériel ou corporel subi par le service (blessure de l'agent lors du contact, dégradation d'effets).<br/>
            <strong>3. [ENTRAVE & TAPAGE ILLICITE] :</strong> Trouble matériel à l'exécution du service (obstruction du passage, vociférations non autorisées).<br/><br/>
            <em>Délai de traitement : 26s. Le chronomètre est suspendu dès l'apposition du tampon pour permettre la lecture du dossier.</em>
          </div>
          <button class="btn-action" onclick="demarrerPartie()">[ PRENDRE LE SERVICE D'INSTRUCTION (OU ENTRÉE) ]</button>
        </div>
      `;
    }

    function demarrerPartie() {
      indexActuel = 0;
      dossiersTraites = 0;
      blames = 0;
      estEnGameOver = false;
      estEnAttenteSuivant = false;
      mettreAJourCompteurs();
      chargerDossier(0);
      dernierTick = performance.now();
      timerId = requestAnimationFrame(boucleJeu);
    }

    function chargerDossier(index) {
      const d = dossiers[index];
      tempsMax = calculerTempsTour(dossiersTraites);
      tempsRestant = tempsMax;
      estEnAttenteSuivant = false;

      zoneCentrale.innerHTML = `
        <div class="dossier-card" id="fiche-dossier">
          <div class="dossier-meta">
            <span>BORDEREAU N° ${d.id}</span>
            <span>DOSSIER ${dossiersTraites + 1} / ${dossiers.length}</span>
            <span id="statut-dossier">EN COURS D'EXAMEN</span>
          </div>

          <div class="dossier-body-grid">
            <div class="dossier-col-text">
              <div class="dossier-bloc-text">
                <div class="dossier-section-title">
                  <span>1. CONSTATATIONS MATÉRIELLES</span>
                  <span style="color: #666; font-size: 9px;">DOC. SOURCE</span>
                </div>
                <div class="dossier-faits">${d.faits}</div>
              </div>

              <div class="dossier-bloc-text" id="bloc-rapport-officiel">
                <div class="dossier-section-title">
                  <span>2. RAPPORT DU CHEF DE DISPOSITIF</span>
                  <span id="badge-scelle" style="color: #f59e0b; font-size: 9px; font-weight: bold;">[🔒 SOUS SCELLÉ CHIFFRÉ]</span>
                </div>
                <div id="contenu-rapport-officiel" style="color: #888; font-style: italic; font-size: 11px; line-height: 1.5;">
                  🔒 SCELLÉ RÉGLEMENTAIRE : Le rapport d'engagement hiérarchique est chiffré. Il sera déverrouillé uniquement après qualification juridique conforme.
                </div>
              </div>
            </div>

            <div class="dossier-col-media">
              <div class="piece-visuelle-cadre">
                <div>
                  <div class="piece-visuelle-entete">
                    <span>
                      <span class="point-enregistrement"></span>
                      ${d.piece_visuelle.type === 'cctv' ? 'SAISIE CSU / VIDÉO' : 'CLICHÉ DE PRESSE'}
                    </span>
                    <span style="color: #ccc; font-weight: bold;">${d.piece_visuelle.horodatage}</span>
                  </div>
                  <div class="piece-visuelle-img-wrapper">
                    <img src="${d.piece_visuelle.url}" class="piece-visuelle-img" alt="Preuve visuelle" />
                    <div class="crt-scanline"></div>
                    <div class="badge-confidentiel">CONFIDENTIEL DÉFENSE</div>
                  </div>
                </div>
                <div class="piece-visuelle-ref">${d.piece_visuelle.reference}</div>
              </div>
            </div>
          </div>

          <div id="zone-feedback"></div>

          <div class="pupitre-tampons" id="pupitre-action">
            <div class="pupitre-titre">SÉLECTIONNEZ LE VISA APPLICABLE [TOUCHES 1, 2, 3 OU CLIC SUR LE BLOC] :</div>
            <div class="grille-tampons">
              ${TAMPONS.map(t => `
                <button class="btn-tampon" onclick="choisirTampon('${t.code}', event)">
                  <div class="btn-tampon-entete">
                    <span class="raccourci-badge">[${t.raccourci}]</span>
                    <span style="font-size: 10px; color: #888;">VISA</span>
                  </div>
                  <div class="btn-tampon-label">${t.label}</div>
                  <div class="btn-tampon-desc">${t.sousTitre}</div>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      mettreAJourBarre();
    }

    function mettreAJourCompteurs() {
      compteurElement.textContent = "DOSSIERS VISÉS : " + dossiersTraites;
      statBlames.textContent = `RAPPELS À L'ORDRE : ${blames} / 3`;
      if (blames > 0) statBlames.classList.add("alerte-rouge");
      else statBlames.classList.remove("alerte-rouge");
    }

    function mettreAJourBarre() {
      const ratio = Math.max(0, Math.min(1, tempsRestant / tempsMax));
      barreTemps.style.width = (ratio * 100) + "%";

      if (estEnAttenteSuivant) {
        tempsTexte.textContent = "[FIGÉ]";
        statCadence.textContent = "DÉLAI : FIGÉ [EN ATTENTE D'ÉMARGEMENT]";
        barreTemps.style.backgroundColor = "#555555";
      } else {
        tempsTexte.textContent = tempsRestant.toFixed(1) + "s";
        statCadence.textContent = "DÉLAI RÈGLEMENTAIRE : " + tempsRestant.toFixed(1) + "s";
        if (tempsRestant < 6.0) {
          barreTemps.style.backgroundColor = "#cc0000";
        } else {
          barreTemps.style.backgroundColor = "#ffffff";
        }
      }
    }

    function boucleJeu(now) {
      if (estEnGameOver) return;
      if (!dernierTick) dernierTick = now;
      const delta = (now - dernierTick) / 1000;
      dernierTick = now;

      if (!estEnAttenteSuivant) {
        tempsRestant -= delta;
        if (tempsRestant <= 0) {
          declencherGameOver("timeout");
          return;
        }
        mettreAJourBarre();
      }

      timerId = requestAnimationFrame(boucleJeu);
    }

    function choisirTampon(codeChoisi, event) {
      if (estEnGameOver || estEnAttenteSuivant) return;
      if (event) event.stopPropagation();

      const tamponObj = TAMPONS.find(t => t.code === codeChoisi);
      const d = dossiers[indexActuel];
      const estCorrect = (codeChoisi === d.categorie_attendue);

      estEnAttenteSuivant = true;
      jouerSonTampon();

      bodyElement.classList.add("shaking");
      setTimeout(() => bodyElement.classList.remove("shaking"), 180);

      // Création du tampon apposé directement sur le cliché / pièce visuelle
      const photoWrapper = document.querySelector(".piece-visuelle-img-wrapper") || document.getElementById("fiche-dossier");
      const tamponEl = document.createElement("div");
      tamponEl.id = "tampon-applique";
      tamponEl.className = "tampon " + (estCorrect ? "succes" : "erreur");
      const angle = -6 + Math.random() * 12;
      tamponEl.style.setProperty("--angle", angle + "deg");
      tamponEl.innerHTML = `
        <div class="tampon-texte">${tamponObj.label}</div>
        <div class="tampon-mention">${estCorrect ? "VISA HOMOLOGUÉ // PIÈCE COTÉE" : "VISA REJETÉ // MOTIF INOPÉRANT"}</div>
      `;
      if (photoWrapper) photoWrapper.appendChild(tamponEl);

      const zoneFeedback = document.getElementById("zone-feedback");
      const statutDossier = document.getElementById("statut-dossier");
      const blocRapport = document.getElementById("bloc-rapport-officiel");
      const badgeScelle = document.getElementById("badge-scelle");
      const contenuRapport = document.getElementById("contenu-rapport-officiel");

      if (statutDossier) statutDossier.textContent = "VISA APPOSÉ // EN ATTENTE D'ÉMARGEMENT";

      if (estCorrect) {
        if (badgeScelle) {
          badgeScelle.textContent = "[🔓 SCELLÉ LEVÉ]";
          badgeScelle.style.color = "#00ff66";
        }
        if (contenuRapport) {
          contenuRapport.innerHTML = `<span style="color: #00ff66; font-size: 13px;">« ${d.jargon_officiel} »</span><div style="font-size: 9px; color: #888; margin-top: 6px; border-top: 1px solid #1e293b; padding-top: 4px;">✓ VERSION OFFICIELLE DU COMMANDEMENT ENREGISTRÉE POUR LE PARQUET</div>`;
        }
        if (blocRapport) {
          blocRapport.style.borderColor = "#00ff66";
          blocRapport.style.backgroundColor = "#001a07";
        }
        if (zoneFeedback) {
          zoneFeedback.innerHTML = `
            <div style="border: 2px solid #00ff66; background-color: #001a07; color: #00ff66; padding: 12px; margin: 10px 0; font-family: monospace;">
              <div style="font-weight: bold; font-size: 13px; border-bottom: 1px solid rgba(0,255,102,0.4); padding-bottom: 6px; margin-bottom: 6px;">
                [✓] HOMOLOGATION CONFIRMÉE — VISA CONFORME AUX DIRECTIVES
              </div>
              <div style="color: #fff; font-size: 11px;">
                <strong>QUALIFICATION VALIDÉE :</strong> [${tamponObj.label}]<br/>
                <span style="color: #aaa;">Le rapport du chef de dispositif est déverrouillé ci-dessus. Mémoire en défense rédigé pour le Parquet.</span>
              </div>
            </div>`;
        }
      } else {
        blames++;
        mettreAJourCompteurs();
        if (badgeScelle) {
          badgeScelle.textContent = "[⛔ SCELLÉ MAINTENU]";
          badgeScelle.style.color = "#ff4444";
        }
        if (contenuRapport) {
          contenuRapport.innerHTML = `<span style="color: #ff8888; font-size: 11px;">⛔ DÉCHIFFREMENT REFUSÉ // La pièce de commandement ne peut être versée sous une qualification inopérante.</span>`;
        }
        if (blocRapport) {
          blocRapport.style.borderColor = "#ff4444";
          blocRapport.style.backgroundColor = "#1a0000";
        }
        if (zoneFeedback) {
          zoneFeedback.innerHTML = `
            <div style="border: 2px solid #ff2222; background-color: #1a0000; color: #ff4444; padding: 12px; margin: 10px 0; font-family: monospace;" class="animate-alerte-erreur">
              <div style="font-weight: bold; font-size: 13px; border-bottom: 1px solid rgba(255,34,34,0.4); padding-bottom: 6px; margin-bottom: 6px;">
                [✗] REJET DU VISA ADMINISTRATIF — RAPPEL À L'ORDRE ${blames} / 3
              </div>
              <div style="color: #fff; font-size: 11px; line-height: 1.5;">
                <strong style="color: #ff4444;">VISA SÉLECTIONNÉ :</strong> [${tamponObj.label}] → MOTIF INOPÉRANT<br/>
                <strong style="color: #f59e0b;">QUALIFICATION IMPÉRATIVE :</strong> [${d.tampon_imposé}]<br/>
                <div style="margin-top: 6px; background: rgba(0,0,0,0.6); padding: 6px; border: 1px solid #ff4444; color: #ddd; font-style: italic;">
                  « ${d.justification_erreur} »
                </div>
                ${blames >= 3 ? '<div style="background: #cc0000; color: #fff; font-weight: bold; padding: 6px; text-align: center; margin-top: 8px;">⚠️ 3 RAPPELS À L\'ORDRE : SUSPENSION IMMÉDIATE DU BRIGADIER</div>' : ''}
              </div>
            </div>`;
        }
      }

      // Remplacement du pupitre par le bouton de contrôle manuel
      const pupitreAction = document.getElementById("pupitre-action");
      if (pupitreAction) {
        const estDernier = (indexActuel + 1 >= dossiers.length);
        const estSuspendu = (blames >= 3);
        let libelleBtn = "[ DOSSIER SUIVANT : ÉMARGER ET PRENDRE LE BORDEREAU SUIVANT (ENTRÉE OU ESPACE) → ]";
        if (estSuspendu) {
          libelleBtn = "[ 3 RAPPELS À L'ORDRE — CONSTATER LA SUSPENSION ADMINISTRATIVE (ENTRÉE OU ESPACE) ]";
        } else if (estDernier) {
          libelleBtn = "[ DERNIÈRE PIÈCE TRAITÉE — TRANSMETTRE LE REGISTRE AU PARQUET (ENTRÉE OU ESPACE) ]";
        }

        pupitreAction.innerHTML = `
          <div style="font-size: 10px; color: #aaa; text-align: center; margin-bottom: 8px; font-family: monospace;">
            PROCÉDURE SUSPENDUE — EXAMINEZ LES MOTIFS AVANT VALIDATION :
          </div>
          <button class="btn-suivant ${estSuspendu ? 'alerte-fin' : ''}" onclick="passerAuDossierSuivant()">
            ${libelleBtn}
          </button>
        `;
      }

      mettreAJourBarre();
    }

    function passerAuDossierSuivant() {
      if (!estEnAttenteSuivant) return;

      if (blames >= 3) {
        declencherGameOver("blames");
        return;
      }

      dossiersTraites++;
      mettreAJourCompteurs();
      indexActuel++;

      if (indexActuel >= dossiers.length) {
        declencherFinVictoire();
      } else {
        chargerDossier(indexActuel);
      }
    }

    function declencherFinVictoire() {
      estEnGameOver = true;
      cancelAnimationFrame(timerId);

      zoneCentrale.innerHTML = `
        <div class="fenetre-modale">
          <div class="modal-titre">CLÔTURE DU REGISTRE CONTENTIEUX</div>
          <div class="modal-message">
            L'ensemble des procédures a fait l'objet d'une qualification conforme aux circulaires ministérielles.
            Les réclamations sont éteintes et les mémoires en défense ont été transmis au Parquet.
          </div>
          <div class="modal-regles">
            • AFFAIRES TRAITÉES : ${dossiersTraites}<br/>
            • INCIDENTS DE DOCTRINE : ${blames} / 3<br/>
            • ÉTAT DU CONTENTIEUX : PROCÉDURES INTÉGRALEMENT RÉGULARISÉES<br/>
            <strong style="color: #cc0000;">• MENTION AU DOSSIER INDIVIDUEL : SERVICE EXEMPLAIRE</strong>
          </div>
          <button class="btn-action" onclick="demarrerPartie()">[ PRENDRE EN CHARGE LE REGISTRE SUIVANT (OU ENTRÉE) ]</button>
        </div>
      `;
      barreTemps.style.width = "100%";
      tempsTexte.textContent = "CLÔTURÉ";
    }

    function declencherGameOver(raison) {
      estEnGameOver = true;
      cancelAnimationFrame(timerId);

      zoneCentrale.innerHTML = `
        <div class="fenetre-modale alerte">
          <div class="modal-titre" style="color: #cc0000;">
            ${raison === "timeout" ? "CADUCITÉ DE LA PROCÉDURE" : "SUSPENSION ADMINISTRATIVE"}
          </div>
          <div class="modal-message">
            ${raison === "timeout"
              ? "Dépassement du délai impératif de traitement. Suspension des fonctions pour lenteur de service."
              : "Constat de 3 erreurs matérielles de qualification juridique. Retrait immédiat de l'habilitation."}
          </div>
          <p style="font-size: 13px; color: #888888; margin-bottom: 24px;">
            Total des bordereaux homologués au registre : ${dossiersTraites}
          </p>
          <button class="btn-action" onclick="demarrerPartie()">[ RÉOUVRIR LE REGISTRE D'INSTRUCTION (OU ENTRÉE) ]</button>
        </div>
      `;
      barreTemps.style.width = "0%";
      tempsTexte.textContent = "0.0s";
    }

    // Raccourcis clavier : 1, 2, 3 ou A, Z, E et validation avec Espace ou Entrée
    window.addEventListener("keydown", (e) => {
      if (estEnGameOver) {
        if (e.code === "Space" || e.code === "Enter") {
          e.preventDefault();
          demarrerPartie();
        }
        return;
      }

      if (estEnAttenteSuivant) {
        if (e.code === "Space" || e.code === "Enter") {
          e.preventDefault();
          passerAuDossierSuivant();
        }
        return;
      }

      if (e.key === "1" || e.key === "a" || e.key === "A" || e.key === "&") {
        choisirTampon("impunite");
      } else if (e.key === "2" || e.key === "z" || e.key === "Z" || e.key === "é") {
        choisirTampon("victimisation");
      } else if (e.key === "3" || e.key === "e" || e.key === "E" || e.key === '"') {
        choisirTampon("mauvaise_foi");
      }
    });

    afficherIntro();
  </script>
</body>
</html>
